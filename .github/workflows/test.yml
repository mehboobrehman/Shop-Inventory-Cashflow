name: Test Suite

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shop_db
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/shop_db
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Generate Prisma Client
        run: cd server && bunx prisma generate
      - name: Migrate Database
        run: cd server && bunx prisma migrate deploy
      - name: Seed Database
        run: cd server && bun run db:seed
      - name: Start Server
        run: |
          cd server
          bun run src/index.ts &
          # Wait for server to be ready
          for i in {1..10}; do
            curl -s http://localhost:4000/api/v1/health && break
            sleep 2
          done
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/shop_db
          PORT: 4000
      - name: Run E2E Verification
        run: node test/e2e_verify.cjs
        env:
          BASE_URL: http://localhost:4000
      - name: Run E2E Edge Cases
        run: node test/e2e_edges.cjs
        env:
          BASE_URL: http://localhost:4000
