name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: shop_db
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/shop_db
      PORT: 4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd server && bunx prisma generate
      - name: Migrate Database
        run: cd server && bunx prisma migrate deploy
      - name: Seed Database
        run: cd server && bun run db:seed
      - name: Start Server
        run: |
          cd server
          bun run src/index.ts &
          # Wait for server to be ready
          for i in {1..10}; do
            curl -s http://localhost:4000/api/v1/health && break
            sleep 2
          done
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/shop_db
          PORT: 4000
      - name: Run E2E Tests
        run: node test/e2e_verify.cjs
        env:
          BASE_URL: http://localhost:4000

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: cd server && bunx prisma generate
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            server/dist
            client/dist
            shared/types

  deploy-staging:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR_STAGING }}
          EXCLUDE: "/node_modules/, /.git/, /.env, /client/node_modules/, /server/node_modules/"
      - name: Run Migrations and Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR_STAGING }}
            bun install --production
            cd server && bunx prisma migrate deploy && cd ..
            pm2 restart pm2.config.js

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rltgoDzvO --delete"
          SOURCE: "."
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGET: ${{ secrets.TARGET_DIR_PROD }}
          EXCLUDE: "/node_modules/, /.git/, /.env, /client/node_modules/, /server/node_modules/"
      - name: Run Migrations and Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_DIR_PROD }}
            bun install --production
            cd server && bunx prisma migrate deploy && cd ..
            pm2 restart pm2.config.js
