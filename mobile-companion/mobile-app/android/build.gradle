// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

subprojects { subproject ->
  subproject.afterEvaluate {
    if (subproject.hasProperty('android')) {
      // Redirect build and C++ staging directories to C:/tmp to avoid MAX_PATH and OneDrive locks
      def safeName = subproject.name.replaceAll('\\s+', '_')
      def bDir = file("C:/tmp/b/${safeName}")
      if (!bDir.exists()) bDir.mkdirs()
      subproject.layout.buildDirectory = bDir

      subproject.android {
        externalNativeBuild {
          cmake {
            def cDir = file("C:/tmp/cxx/${safeName}")
            if (!cDir.exists()) cDir.mkdirs()
            buildStagingDirectory = cDir
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
